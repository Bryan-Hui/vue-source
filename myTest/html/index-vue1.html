    <h3>测试 init.js 41-45行：_isComponent 分支逻辑</h3>
    <div id="app">
      <p>根实例 msg: {{msg}}</p>
      <input v-model="msg" placeholder="输入触发 $data setter / $watch / $nextTick" />
      <button v-on:click="onClick">点击触发 $on / $emit / $forceUpdate</button>
      <button v-on:click="toggleComp">切换子组件触发 $destroy</button>
      <my-comp v-if="showComp" v-on:custom-event="onCustomEvent"></my-comp>
    </div>

  <script>
    // console.log("========== 测试1：new Vue() 根实例 ==========");

    // 测试1：根实例 new Vue()
    // 此时 options = { el: '#app', data: {...}, components: {...} }
    // options._isComponent === undefined → 走 else 分支 (第44行)
    // resolveConstructorOptions(vm.constructor) → vm.constructor = Vue
    // Vue 没有 super 属性 → 直接返回 Vue.options
    const app = new Vue({
      el: "#app",
      data: {
        msg: "Hello World!",
        showComp: true
      },
      watch: {
        msg(newVal) {
          console.log('$watch 触发:', newVal)
        }
      },
      methods: {
        onClick() {
          this.msg = 'clicked'
          this.$forceUpdate()
        },
        toggleComp() {
          this.showComp = !this.showComp
        },
        onCustomEvent(e) {
          this.msg = e
        }
      },
      mounted() {
        this.$nextTick(() => {
          console.log('根实例 $nextTick 回调执行')
        })
      },
      components: {
        "my-comp": {
          template: "<p>我是子组件: {{childMsg}} <button @click='sendEvent'>发送事件</button></p>",
          data() {
            return { childMsg: "child data" };
          },
          methods: {
            sendEvent() {
              this.$emit('custom-event', '来自子组件')
            }
          },
          mounted() {
            this.$on('hook:beforeDestroy', () => {
              console.log('子组件 beforeDestroy 钩子触发')
            })
            this.$nextTick(() => {
              console.log('子组件 $nextTick 执行')
            })
          }
        },
      },
    });
